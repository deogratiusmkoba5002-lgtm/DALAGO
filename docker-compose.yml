services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: dalago
      POSTGRES_USER: dalago
      POSTGRES_PASSWORD: dalago
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db

volumes:
  pgdata:
